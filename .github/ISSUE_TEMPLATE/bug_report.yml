name: Bug report
description: Something behaves differently from what the documentation or tests promise
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: What you saw, including error codes and correlation IDs where you have them.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Requests, carrier simulator commands or a failing test.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (Docker Compose)
        - Local (without Docker)
        - CI
        - Other
