name: Feature request
description: A new capability or a change to existing behaviour
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that tell us this is done.
      placeholder: "- [ ] ..."
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Alternatives considered, affected repositories, migration or rollout concerns.
