name: API CI

# Runs when the API or this workflow changes. When it does not run, the API was
# not verified by that commit; it was verified by the last commit that did.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    working-directory: api

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/constraints.txt
      - run: python -m pip install --constraint constraints.txt -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/constraints.txt
      - run: python -m pip install --constraint constraints.txt -e ".[dev]"
      - run: mypy

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/constraints.txt
      - run: python -m pip install --constraint constraints.txt -e ".[dev]"
      - run: pytest tests/unit --junitxml=reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-junit-unit
          path: api/reports/unit.xml

  # One job per behaviour area. A suite that fails, or that was never run, is
  # visible by name on the commit instead of being folded into a single check.
  integration-tests:
    name: Integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: shipments
            path: tests/integration/test_shipments_api.py
          - suite: webhook-ingestion
            path: tests/integration/test_webhook_ingestion.py
          - suite: webhook-idempotency
            path: tests/integration/test_webhook_idempotency.py
          - suite: event-ordering
            path: tests/integration/test_event_ordering.py
          - suite: timeline
            path: tests/integration/test_timeline.py
          - suite: notifications
            path: tests/integration/test_notifications.py
          - suite: queue-publisher
            path: tests/integration/test_queue_publisher.py
          - suite: operations
            path: tests/integration/test_operations.py
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: parcelpulse
          POSTGRES_PASSWORD: parcelpulse
          POSTGRES_DB: parcelpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parcelpulse -d parcelpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://parcelpulse:parcelpulse@localhost:5432/parcelpulse_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/constraints.txt
      - run: python -m pip install --constraint constraints.txt -e ".[dev]"
      - run: pytest ${{ matrix.path }} --junitxml=reports/${{ matrix.suite }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-junit-integration-${{ matrix.suite }}
          path: api/reports/${{ matrix.suite }}.xml

  migrations:
    name: Migration sanity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: parcelpulse
          POSTGRES_PASSWORD: parcelpulse
          POSTGRES_DB: parcelpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parcelpulse -d parcelpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://parcelpulse:parcelpulse@localhost:5432/parcelpulse_test
      TEST_DATABASE_URL: postgresql+psycopg://parcelpulse:parcelpulse@localhost:5432/parcelpulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/constraints.txt
      - run: python -m pip install --constraint constraints.txt -e ".[dev]"
      - name: Upgrade an empty database to head
        run: alembic upgrade head
      - name: Models match the migrated schema
        run: alembic check
      - name: Downgrade to base and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Migration tests
        run: pytest tests/integration/test_migrations.py --junitxml=reports/migrations.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-junit-migrations
          path: api/reports/migrations.xml

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag parcelpulse-api:ci .
      - name: Image starts and reports liveness
        run: |
          docker run --detach --name api --publish 8000:8000 \
            --env DATABASE_URL=postgresql+psycopg://unused:unused@localhost:5432/unused \
            --env WEBHOOK_SIGNING_SECRET=ci-only-signing-secret-000000 \
            parcelpulse-api:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
