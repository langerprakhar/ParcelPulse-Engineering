name: Full-stack CI

# Builds the whole Compose stack from this checkout, starts it from an empty
# database and runs the end-to-end smoke test. This is the only check of the
# contracts between the components (REST API, queue message, database schema),
# so it runs when any of them changes, not only infra/.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "worker/**"
      - "infra/**"
      - ".github/workflows/full-stack-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - "web/**"
      - "worker/**"
      - "infra/**"
      - ".github/workflows/full-stack-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-stack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Stack from empty database and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - name: Docker and Compose versions
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
      - name: Build the images
        run: docker compose build
      - name: Start the stack from empty volumes and wait until healthy
        run: docker compose up --detach --wait --wait-timeout 300
      - name: Service status
        if: always()
        run: docker compose ps --all
      - name: Migrations applied from zero
        run: |
          docker compose logs api-migrate
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet api-migrate)")
          echo "api-migrate exit code: ${exit_code}"
          test "${exit_code}" = "0"
      - name: End-to-end smoke test
        run: docker compose run --rm smoke
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
