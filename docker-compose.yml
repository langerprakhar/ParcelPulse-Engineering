# ParcelPulse local stack.
#
#   docker compose up --build
#
# Defaults work without a .env file; copy .env.example to .env to override them.
name: parcelpulse

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parcelpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcelpulse}
      POSTGRES_DB: ${POSTGRES_DB:-parcelpulse}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parcelpulse} -d ${POSTGRES_DB:-parcelpulse}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    # Append-only file: queued notification messages survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Development mail sink: accepts any SMTP message and shows it in a web UI.
  # Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
