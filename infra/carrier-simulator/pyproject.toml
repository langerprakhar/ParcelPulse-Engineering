[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carrier-simulator"
version = "0.1.0"
description = "Simulated parcel carrier that sends signed tracking webhooks to ParcelPulse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "httpx2==2.13.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[project.scripts]
carrier-sim = "carrier_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
