# Tooling configuration for the Python files at the top level of this repository
# (tests/, loadtest/). The carrier simulator has its own project in carrier-simulator/.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["carrier-simulator"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
