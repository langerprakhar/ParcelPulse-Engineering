[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parcelpulse-worker"
version = "0.1.0"
description = "ParcelPulse asynchronous notification worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dramatiq[redis]==2.2.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "sqlalchemy==2.1.1",
]

[project.optional-dependencies]
dev = [
    "aiosmtpd==1.4.6",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dramatiq.*"]
ignore_missing_imports = true
